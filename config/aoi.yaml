#: Area of interest, study seasons and analysis grid for the Nile Delta crop
#: monitoring pipeline. Coordinates are WGS84 (EPSG:4326), decimal degrees.

name: central-delta-tanta

bbox:
  west: 30.86
  south: 30.75
  east: 31.36
  north: 31.20

crs: EPSG:4326

#: The same 1 May - 30 Sep window is pulled for every year.
#: 2023 is analysed as the focus season; 2019-2022 (and 2023 by leave-one-out)
#: form the historical baseline for anomaly calculations.
seasons:
  focus: 2023
  years: [2019, 2020, 2021, 2022, 2023]
  window:
    start: "05-01"
    end: "09-30"
  label: "Summer (rice / maize / cotton)"

grid:
  cell_size_m: 100
  crs: EPSG:32636

sources:
  imagery: earth-search
  imagery_fallback: copernicus-cdse

quality:
  max_scene_cloud_pct: 40
  min_weekly_observations: 2
  max_weekly_masked_pct: 50

#: Bronze -> Silver rules (Phase 3). Values here are the ones the code reads;
#: PROJECT.md documents why each was chosen.
silver:
  #: A cell keeps a value only if at least this share of its in-AOI 10 m pixels
  #: has a valid NDVI (unmasked AND non-zero reflectance AND denominator > 0).
  min_valid_fraction: 0.5
  #: SCL classes dropped before aggregation: 0 no-data, 1 saturated, 2 dark area,
  #: 3 cloud shadow, 8 cloud medium, 9 cloud high, 10 thin cirrus, 11 snow/ice.
  #: Kept: 4 vegetation, 5 bare, 6 water, 7 unclassified.
  masked_scl_classes: [0, 1, 2, 3, 8, 9, 10, 11]
  #: Tile preference when both tiles carry a valid pixel for the same ground.
  tile_priority: ["36RTV", "36RUV"]
  #: Gate: if class 2 or class 7 exceeds this share of in-AOI pixels in a season,
  #: stop and review the mask (flooded rice can be labelled water or dark area).
  max_scl_dark_pct: 5.0
  max_scl_unclassified_pct: 5.0
  #: Cross-era stable-target check. Frozen from the Phase 3 survey before any
  #: 2019-vs-2023 comparison is computed. Test skips while null.
  stable_target:
    #: WorldCover class used for the stable target (80 = water).
    class: 80
    #: Erosion in pixels (3 px = 30 m at 10 m resolution) to exclude mixed edge pixels.
    erosion_px: 3
    #: 1-7 July window used for both eras.
    window: ["07-01", "07-07"]
    #: Minimum valid eroded-target pixels required in each year (1-7 July window).
    min_valid_pixels: 1000
    #: Pooling rule: "at_least_one_date" means a pixel counts for a year if it is
    #: valid (SCL-unmasked AND DN > 0 in both bands) on at least one date in that
    #: year's window.
    pooling: "at_least_one_date"
    #: Tolerances for the 2019-vs-2023 comparison (not to be changed without sign-off).
    max_delta_median_red: 0.02
    max_delta_median_ndvi: 0.05
