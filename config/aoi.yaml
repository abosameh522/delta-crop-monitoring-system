#: Area of interest, study seasons and analysis grid for the Nile Delta crop
#: monitoring pipeline. Coordinates are WGS84 (EPSG:4326), decimal degrees.

name: central-delta-tanta

bbox:
  west: 30.86
  south: 30.75
  east: 31.36
  north: 31.20

crs: EPSG:4326

#: The same 1 May - 30 Sep window is pulled for every year.
#: 2023 is analysed as the focus season; 2019-2022 (and 2023 by leave-one-out)
#: form the historical baseline for anomaly calculations.
seasons:
  focus: 2023
  years: [2019, 2020, 2021, 2022, 2023]
  window:
    start: "05-01"
    end: "09-30"
  label: "Summer (rice / maize / cotton)"

grid:
  cell_size_m: 100
  crs: EPSG:32636

sources:
  imagery: earth-search
  imagery_fallback: copernicus-cdse

quality:
  max_scene_cloud_pct: 40
  min_weekly_observations: 2
  max_weekly_masked_pct: 50

#: Bronze -> Silver rules (Phase 3). Values here are the ones the code reads;
#: PROJECT.md documents why each was chosen.
silver:
  #: A cell keeps a value only if at least this share of its in-AOI 10 m pixels
  #: has a valid NDVI (unmasked AND non-zero reflectance AND denominator > 0).
  min_valid_fraction: 0.5
  #: SCL classes dropped before aggregation: 0 no-data, 1 saturated, 2 dark area,
  #: 3 cloud shadow, 8 cloud medium, 9 cloud high, 10 thin cirrus, 11 snow/ice.
  #: Kept: 4 vegetation, 5 bare, 6 water, 7 unclassified.
  masked_scl_classes: [0, 1, 2, 3, 8, 9, 10, 11]
  #: Tile preference when both tiles carry a valid pixel for the same ground.
  tile_priority: ["36RTV", "36RUV"]
  #: Gate: if class 2 or class 7 exceeds this share of in-AOI pixels in a season,
  #: stop and review the mask (flooded rice can be labelled water or dark area).
  max_scl_dark_pct: 5.0
  max_scl_unclassified_pct: 5.0
  #: Post-hoc within-orbit rule, frozen before its first cross-era comparison.
  #: Option B (water, class 80) was dropped: B08 DN floor on dark targets and
  #: temporal instability of WorldCover water made it unreliable.
  #: Option C (built-up, class 50) is used instead.
  stable_target:
    #: WorldCover class used for the stable target (50 = built-up).
    class: 50
    #: Erosion in pixels (3 px = 30 m at 10 m resolution) to exclude mixed edge pixels.
    erosion_px: 3
    #: Minimum connected-component size in pixels (1 km2 = 10,000 px at 10 m).
    min_component_px: 10000
    #: Window for qualifying dates (both eras).
    window: ["06-01", "08-31"]
    years: [2019, 2023]
    grouping: "relative_orbit"
    orbit_source: "s2:product_uri"
    groups:
      R021: {sensing_time_utc_minute: "08:41"}
      R064: {sensing_time_utc_minute: "08:51"}
    allowed_tile_mixes: [["36RTV", "36RUV"], ["36RUV"]]
    eligibility: "min_qualifying_dates_in_each_year"
    verdict: "all_eligible_groups_pass_both_tolerances"
    #: Evaluate every eligible group; never drop one after seeing its results.
    report_path: "silver/_reports/stable_target_dates.parquet"
    #: Qualifying-date rule: a date qualifies if valid pixels >= this fraction of the set.
    min_valid_fraction: 0.5
    #: Tile preference for single-tile dates (36RUV preferred as single source).
    tile_priority: ["36RTV", "36RUV"]
    #: Per-date valid requires: SCL-unmasked AND DN > 0 in both bands AND DN > 1 in both bands.
    #: This excludes the B08 DN==1 floor on dark targets.
    require_dn_gt_one: true
    #: Minimum number of qualifying dates required per year.
    min_qualifying_dates: 2
    #: Pooling: compute median per qualifying date, then median of date-medians per year.
    pooling: "median_of_date_medians"
    #: Tolerances for the 2019-vs-2023 comparison (not to be changed without sign-off).
    max_delta_median_red: 0.02
    max_delta_median_ndvi: 0.05
    #: Previous Option C rule retained verbatim below; superseded post-hoc.
    superseded:
      class: 50
      erosion_px: 3
      min_component_px: 10000
      window: ["07-01", "07-14"]
      min_valid_fraction: 0.5
      tile_priority: ["36RTV", "36RUV"]
      require_dn_gt_one: true
      min_qualifying_dates: 2
      pooling: "median_of_date_medians"
      max_delta_median_red: 0.02
      max_delta_median_ndvi: 0.05
      grouping: "none"

#: Phase 4 quality rules. Missing NDVI is reported, never filled.
#: Gap thresholds were revised after measuring the real Silver distributions.
data_quality:
  ndvi_min: -1.0
  ndvi_max: 1.0
  masked_pct_alert_threshold: 50.0
  dual_tile_null_alert_pct: 50.0
  null_mad_multiplier: 6.0
  null_mad_min_other_dates: 5
  gap_info_days: 10               # share with longest gap >10; never alerts
  gap_alert_days: 13              # longest gap >=13; includes a full ISO week
  gap_season_alert_pct: 10.0      # alert when strictly more than 10% violate
  gap_statistics_days: [10, 13, 21, 30]
  duckdb_threads: 4
  duckdb_memory_limit: "2GB"
  max_failure_examples: 5
  severity:
    schema: critical
    ndvi_range: critical
    duplicate_keys: critical
    row_count: critical
    pixel_counts: critical
    missing_partition: critical
    date_partition: critical
    required_values: critical
    cell_keys: critical
    null_rate: alert
    masked_pct: alert
    gaps: alert
    gap_season: alert
    acquisition_gaps: info
  #: Retain original six July dates; add May/June/August/September in both eras.
  dn_floor_audit_dates:
    - "2019-05-19"
    - "2019-06-18"
    - "2019-07-01"
    - "2019-07-03"
    - "2019-07-06"
    - "2019-08-12"
    - "2019-09-06"
    - "2023-05-23"
    - "2023-06-22"
    - "2023-07-02"
    - "2023-07-05"
    - "2023-07-07"
    - "2023-08-06"
    - "2023-09-05"
