# Local orchestration: one container serves one five-day Prefect deployment.
# `flow.serve` starts the ephemeral Prefect API in-process (SQLite in
# PREFECT_HOME), so there is no separate server or worker container.
name: delta-crops

services:
  orchestrator:
    build:
      context: .
      target: runtime
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: delta-crops:6b
    init: true
    restart: unless-stopped
    command: ["python", "-m", "delta_crops.orchestration.serve"]
    stop_grace_period: 30s
    environment:
      # data_dir() / config_path() read these when no CLI flag is given.
      DELTA_CROPS_DATA_DIR: /app/data
      DELTA_CROPS_CONFIG: /app/config/aoi.yaml
      # Prefect state lives outside data/, in its own bind mount.
      PREFECT_HOME: /var/lib/prefect
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PYTHONUNBUFFERED: "1"
    env_file:
      # Optional: only needed if Copernicus Data Space credentials are added
      # later. Earth Search and Open-Meteo need no credentials.
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./.prefect:/var/lib/prefect
    healthcheck:
      test: ["CMD", "python", "-m", "delta_crops.orchestration.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Container-side test run. `tests/` is deliberately not in the image, so it is
  # mounted read-only; pytest comes from the `test` build stage.
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: delta-crops:6b-test
    init: true
    restart: "no"
    environment:
      DELTA_CROPS_DATA_DIR: /app/data
      DELTA_CROPS_CONFIG: /app/config/aoi.yaml
      PREFECT_HOME: /var/lib/prefect
      PYTHONUNBUFFERED: "1"
    volumes:
      # Read-only on purpose: a test that writes the real lake must fail.
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./.prefect-test:/var/lib/prefect
      - ./tests:/app/tests:ro
    command: ["pytest", "-q", "-m", "not slow and not flow"]
